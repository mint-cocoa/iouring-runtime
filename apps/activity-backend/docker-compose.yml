services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: iouring-runtime-activity-backend:main
    container_name: iouring-activity-backend
    restart: unless-stopped
    env_file:
      - /etc/iouring-runtime/activity-backend.env
    ports:
      - "8000:8000"
    volumes:
      - /var/lib/iouring-runtime/activity-backend/downloads:/app/downloads
      - ${ACTIVITY_BACKEND_COOKIE_FILE:-/etc/iouring-runtime/activity-backend.cookie.txt}:/app/cookie.txt:ro
    networks:
      youtube_backend_default:
        aliases:
          - backend

networks:
  youtube_backend_default:
    external: true
    name: youtube-backend_default
