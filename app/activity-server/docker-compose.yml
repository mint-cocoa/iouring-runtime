services:
  backend:
    build:
      context: ../..
      dockerfile: app/activity-server/Dockerfile
    image: iouring-runtime-activity-server:main
    container_name: iouring-activity-backend
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    environment:
      ACTIVITY_HOST: 0.0.0.0
      ACTIVITY_PORT: "8000"
      ACTIVITY_DOWNLOAD_DIR: /var/lib/iouring-runtime/activity-server/downloads
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - /var/lib/iouring-runtime/activity-server/downloads:/var/lib/iouring-runtime/activity-server/downloads
    networks:
      youtube_backend_default:
        aliases:
          - backend

networks:
  youtube_backend_default:
    external: true
    name: youtube-backend_default
