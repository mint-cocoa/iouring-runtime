worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;
    error_log /dev/stderr warn;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;
        default_type text/plain;

        location = / {
            return 200 "hello from nginx\n";
        }

        location = /health {
            return 200 "ok";
        }
    }
}
