worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/stderr warn;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;

    server {
        listen 8080 reuseport;
        server_name _;
        default_type text/plain;
        root /srv/www;

        location = / {
            add_header Content-Type text/plain always;
            return 200 "hello from iouring_web";
        }

        location = /health {
            add_header Content-Type text/plain always;
            return 200 "ok";
        }

        location = /payload/256b {
            try_files /payload-256b.txt =404;
        }

        location = /payload/4k {
            try_files /payload-4k.txt =404;
        }

        location = /payload/64k {
            try_files /payload-64k.txt =404;
        }
    }
}
