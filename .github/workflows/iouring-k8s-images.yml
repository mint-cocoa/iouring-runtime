name: iouring k8s images

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile.k8s-web"
      - "app/activity-server/**"
      - "app/examples/web/**"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/iouring-k8s-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: web
            file: Dockerfile.k8s-web
          - name: activity
            file: app/activity-server/Dockerfile
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/mint-cocoa/iouring-runtime:${{ matrix.image.name }}-main
            ghcr.io/mint-cocoa/iouring-runtime:${{ matrix.image.name }}-${{ github.sha }}
