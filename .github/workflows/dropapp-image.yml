name: dropapp image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mint-cocoa/dropapp:main
            ghcr.io/mint-cocoa/dropapp:${{ github.sha }}

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: mint-cocoa/mintcocoa-ops
          token: ${{ secrets.MINTCOCOA_OPS_TOKEN }}
          path: gitops

      - name: Update dropapp image tag
        working-directory: gitops
        run: |
          path="apps/dropapp/overlays/staging/kustomization.yaml"
          if [ ! -f "$path" ]; then
            echo "GITOPS_IMAGE_PATH=" >> "$GITHUB_ENV"
            echo "::notice::Skipping GitOps update because $path does not exist"
            exit 0
          fi
          echo "GITOPS_IMAGE_PATH=$path" >> "$GITHUB_ENV"
          sed -i 's|newName: .*|newName: ghcr.io/mint-cocoa/dropapp|' "$path"
          sed -i "s|newTag: .*|newTag: ${GITHUB_SHA}|" "$path"

      - name: Commit GitOps update
        if: env.GITOPS_IMAGE_PATH != ''
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GITOPS_IMAGE_PATH"
          git commit -m "deploy dropapp ${GITHUB_SHA}" || exit 0
          git push
