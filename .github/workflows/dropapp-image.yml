name: dropapp image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mint-cocoa/dropapp:${{ github.sha }}

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: mint-cocoa/home-k8s-gitops
          token: ${{ secrets.HOME_K8S_GITOPS_TOKEN }}
          path: gitops

      - name: Update dropapp image tag
        working-directory: gitops
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("apps/dropapp/values.yaml")
          text = path.read_text()
          lines = []
          in_image = False
          changed = False
          for line in text.splitlines():
              stripped = line.strip()
              if not line.startswith(" ") and stripped == "image:":
                  in_image = True
                  lines.append(line)
                  continue
              if in_image and not line.startswith(" "):
                  in_image = False
              if in_image and stripped.startswith("tag:"):
                  indent = line[: len(line) - len(line.lstrip())]
                  line = f'{indent}tag: "{os.environ["GITHUB_SHA"]}"'
                  changed = True
              lines.append(line)
          if not changed:
              raise SystemExit("apps/dropapp/values.yaml image.tag not found")
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit GitOps update
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dropapp/values.yaml
          git commit -m "deploy dropapp ${GITHUB_SHA}" || exit 0
          git push
